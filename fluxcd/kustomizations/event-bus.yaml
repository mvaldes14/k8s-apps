apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: event-bus-flux
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repository
  path: "./event-bus"
  prune: true
  timeout: 5m
  # The Application references project "homelab", which argo-flux creates.
  dependsOn:
    - name: argo-flux
