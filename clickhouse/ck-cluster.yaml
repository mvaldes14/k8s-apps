apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: ck-cluster
  namespace: clickhouse
spec:
  replicas: 1
  shards: 1
  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname
    # Pinned off eva03, which also hosts the SigNoz ClickHouse. Both back onto the
    # same NFS server (10.14.0.21), and the shared client saturated eva03 with iowait.
    nodeSelector:
      kubernetes.io/hostname: eva06
  keeperClusterRef:
    name: ck-keeper
  settings:
    logger:
      level: information
    extraConfig:
      query_log:
        ttl: event_date + INTERVAL 3 DAY DELETE
      part_log:
        ttl: event_date + INTERVAL 3 DAY DELETE
      text_log:
        ttl: event_date + INTERVAL 3 DAY DELETE
      metric_log:
        ttl: event_date + INTERVAL 3 DAY DELETE
      asynchronous_metric_log:
        ttl: event_date + INTERVAL 3 DAY DELETE
  dataVolumeClaimSpec:
    storageClassName: local-direct
    resources:
      requests:
        storage: 50Gi
  containerTemplate:
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "4Gi"
---
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: ck-keeper
  namespace: clickhouse
spec:
  replicas: 1
  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    storageClassName: nfs-k8s-keep
    resources:
      requests:
        storage: 1Gi
