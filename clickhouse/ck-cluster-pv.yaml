apiVersion: v1
kind: PersistentVolume
metadata:
  name: ck-cluster-data-eva06
  labels:
    app: ck-cluster-clickhouse
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-direct
  volumeMode: Filesystem
  local:
    path: /var/lib/local-pv/ck-cluster
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - eva06
