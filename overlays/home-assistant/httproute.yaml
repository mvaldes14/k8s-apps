apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hoa
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - hoa.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hoa-svc
          port: 80
