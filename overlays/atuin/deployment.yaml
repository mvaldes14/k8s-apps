apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-server
  annotations:
    secret.reloader.stakater.com/reload: "atuin-secrets"
  labels:
    app: atuin-server
spec:
  selector:
    matchLabels:
      app: atuin-server
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: atuin-server
      labels:
        app: atuin-server
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: atuin-server
          image: ghcr.io/atuinsh/atuin@sha256:6adfe3b9d434542cb4addb64bb49414a9ebe815609c48bfd16fa8b2e26354aa9
          args:
            - start
          imagePullPolicy: IfNotPresent
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          env:
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  name: atuin-secrets
                  key: ATUIN_DB_URI
            - name: ATUIN_HOST
              value: 0.0.0.0
            - name: ATUIN_PORT
              value: '8888'
            - name: ATUIN_OPEN_REGISTRATION
              value: 'true'
          ports:
            - containerPort: 8888
              name: atuin-port
          volumeMounts:
            - name: atuin-volume
              mountPath: /config
      volumes:
        - name: atuin-volume
          persistentVolumeClaim:
            claimName: atuin-pvc
      restartPolicy: Always
