apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atuin
resources:
  - ../../bases/external-secret
  - ../../bases/http-route
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - service.yaml
patches:
  - path: externalsecret.patch.yaml
    target:
      kind: ExternalSecret
      name: app-secret
  - path: httproute.patch.yaml
    target:
      kind: HTTPRoute
      name: app-httproute
