apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
spec:
  ai:
    provider:
      openai:
        model: "gpt-5-mini"
  policies:
    auth:
      secretRef:
        name: agentgateway-secrets
        key: OPENAI_KEY
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
spec:
  # static passthrough: agentgateway's ai backend re-marshals the request body
  # and rejects native Anthropic clients that send tools ("missing field `type`").
  # forward as-is to api.anthropic.com, just injecting the key.
  static:
    host: api.anthropic.com
    port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: agentgateway-secrets
        key: CLAUDE_KEY
      location:
        header:
          name: x-api-key
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter
spec:
  ai:
    provider:
      openai:
        model: openrouter/auto
      host: openrouter.ai
      port: 443
      path: /api/v1/chat/completions
  policies:
    auth:
      secretRef:
        name: agentgateway-secrets
        key: OPENROUTER_KEY
    tls:
      sni: openrouter.ai


