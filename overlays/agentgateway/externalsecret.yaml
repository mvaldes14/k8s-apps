apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store-apps
  refreshPolicy: Periodic
  refreshInterval: 10m
  dataFrom:
    - extract:
        key: apps/agentgateway
  target:
    name: agentgateway-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
