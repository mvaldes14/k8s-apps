apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signoz-flux
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-repository
  path: "./overlays/signoz"
  prune: true
  timeout: 30m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: operator
      namespace: signoz
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signoz-resources-flux
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-repository
  path: "./overlays/signoz/resources"
  prune: true
  timeout: 10m
  dependsOn:
    - name: signoz-flux
