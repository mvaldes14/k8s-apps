apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db-flux
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-repository
  path: "./overlays/db"
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: homelab-db
      namespace: db
