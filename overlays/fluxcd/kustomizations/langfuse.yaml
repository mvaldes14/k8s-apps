apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-flux
spec:
  suspend: true
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-repository
  path: "./overlays/langfuse"
  prune: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
