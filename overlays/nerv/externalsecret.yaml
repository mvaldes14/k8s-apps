apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nerv-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store-apps
  refreshPolicy: Periodic
  refreshInterval: 10m
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/nerv
        property: DATABASE_URL
    - secretKey: NERV_AUTH_TOKEN
      remoteRef:
        key: apps/nerv
        property: NERV_AUTH_TOKEN
    - secretKey: NERV_AGENTGATEWAY_TOKEN
      remoteRef:
        key: apps/nerv
        property: NERV_AGENTGATEWAY_TOKEN
    - secretKey: NERV_DECISION_GATEWAY_TOKEN
      remoteRef:
        key: apps/nerv
        property: NERV_DECISION_GATEWAY_TOKEN
    - secretKey: NERV_GOTIFY_TOKEN
      remoteRef:
        key: apps/nerv
        property: NERV_GOTIFY_TOKEN
  target:
    name: nerv-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
