apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis
spec:
  # Cloudflare Tunnel continues to call the Service directly.
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: web
  hostnames:
    - atlantis.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: atlantis-atlantis-release
          port: 80
