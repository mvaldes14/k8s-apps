apiVersion: v1
kind: Namespace
metadata:
  name: atlantis
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: atlantis-helm
spec:
  interval: 10m0s
  url: https://runatlantis.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atlantis-release
spec:
  targetNamespace: atlantis
  chart:
    spec:
      chart: atlantis
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: atlantis-helm
      version: 6.15.0
  valuesFrom:
    - kind: ConfigMap
      name: atlantis-cm
  interval: 5m0s
