apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - s3.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: garage-svc
          port: 3900
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3ui
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - s3ui.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: garage-svc-ui
          port: 3909
