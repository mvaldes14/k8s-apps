apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik
spec:
  gatewayClassName: traefik
  listeners:
    # Listener ports match Traefik entrypoints, not Service ports 80/443.
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: atlantis
        kinds:
          - kind: HTTPRoute
    - name: websecure
      port: 8443
      protocol: HTTPS
      hostname: "*.int.mvaldes.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-int-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - grafana
                  - agentgateway
                  - arr
                  - atuin
                  - decision-gateway
                  - garage
                  - hoa
                  - signoz
                  - td
        kinds:
          - kind: HTTPRoute
