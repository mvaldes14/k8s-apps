apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  targetNamespace: trivy-system
  chart:
    spec:
      chart: trivy-operator
      version: 0.38.1
      sourceRef:
        kind: HelmRepository
        name: aqua-security
  values:
    operator:
      scanJobTimeout: 10m
      scanJobsConcurrentLimit: 3
      webhookBroadcastURL: http://n8n-svc.n8n.svc.cluster.local/webhook/trivy-operator-alerts
      webhookBroadcastTimeout: 30s
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi
