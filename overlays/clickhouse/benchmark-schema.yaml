apiVersion: v1
kind: ConfigMap
metadata:
  name: ck-benchmark-schema-v3
data:
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS homelab;

    CREATE TABLE IF NOT EXISTS homelab.log_map_v3
    (
      `Timestamp` DateTime64(9) CODEC(Delta(8), ZSTD(1)),
      `TraceId` String CODEC(ZSTD(1)),
      `SpanId` String CODEC(ZSTD(1)),
      `TraceFlags` UInt8,
      `SeverityText` LowCardinality(String) CODEC(ZSTD(1)),
      `SeverityNumber` UInt8,
      `ServiceName` LowCardinality(String) CODEC(ZSTD(1)),
      `Body` String CODEC(ZSTD(1)),
      `ResourceSchemaUrl` LowCardinality(String) CODEC(ZSTD(1)),
      `ResourceAttributes` Map(LowCardinality(String), String) CODEC(ZSTD(1)),
      `ScopeSchemaUrl` LowCardinality(String) CODEC(ZSTD(1)),
      `ScopeName` String CODEC(ZSTD(1)),
      `ScopeVersion` LowCardinality(String) CODEC(ZSTD(1)),
      `ScopeAttributes` Map(LowCardinality(String), String) CODEC(ZSTD(1)),
      `LogAttributes` Map(LowCardinality(String), String) CODEC(ZSTD(1)),
      `EventName` String CODEC(ZSTD(1)),
      `__otel_materialized_k8s.container.name` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.container.name'] CODEC(ZSTD(1)),
      `__otel_materialized_k8s.deployment.name` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.deployment.name'] CODEC(ZSTD(1)),
      `__otel_materialized_k8s.namespace.name` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.namespace.name'] CODEC(ZSTD(1)),
      `__otel_materialized_k8s.node.name` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.node.name'] CODEC(ZSTD(1)),
      `__otel_materialized_k8s.pod.name` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.pod.name'] CODEC(ZSTD(1)),
      `__otel_materialized_k8s.pod.uid` LowCardinality(String)
        MATERIALIZED ResourceAttributes['k8s.pod.uid'] CODEC(ZSTD(1)),
      INDEX idx_trace_id TraceId TYPE bloom_filter(0.001) GRANULARITY 1,
      INDEX idx_body Body TYPE tokenbf_v1(32768, 3, 0) GRANULARITY 8,
      INDEX idx_namespace `__otel_materialized_k8s.namespace.name` TYPE bloom_filter(0.01) GRANULARITY 1,
      INDEX idx_pod `__otel_materialized_k8s.pod.name` TYPE bloom_filter(0.01) GRANULARITY 1
    )
    ENGINE = MergeTree
    PARTITION BY toDate(Timestamp)
    ORDER BY (toStartOfFiveMinutes(Timestamp), ServiceName, Timestamp)
    TTL toDateTime(Timestamp) + INTERVAL 15 DAY
    SETTINGS index_granularity = 8192, ttl_only_drop_parts = 1;

    CREATE TABLE IF NOT EXISTS homelab.log_json_v3
    (
      `Timestamp` DateTime64(9) CODEC(Delta(8), ZSTD(1)),
      `TraceId` String CODEC(ZSTD(1)),
      `SpanId` String CODEC(ZSTD(1)),
      `TraceFlags` UInt8,
      `SeverityText` LowCardinality(String) CODEC(ZSTD(1)),
      `SeverityNumber` UInt8,
      `ServiceName` LowCardinality(String) CODEC(ZSTD(1)),
      `Body` String CODEC(ZSTD(1)),
      `ResourceSchemaUrl` LowCardinality(String) CODEC(ZSTD(1)),
      `ResourceAttributes` JSON CODEC(ZSTD(1)),
      `ScopeSchemaUrl` LowCardinality(String) CODEC(ZSTD(1)),
      `ScopeName` String CODEC(ZSTD(1)),
      `ScopeVersion` LowCardinality(String) CODEC(ZSTD(1)),
      `ScopeAttributes` JSON CODEC(ZSTD(1)),
      `LogAttributes` JSON CODEC(ZSTD(1)),
      `EventName` String CODEC(ZSTD(1)),
      `__otel_materialized_k8s.container.name` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.container.name`) CODEC(ZSTD(1)),
      `__otel_materialized_k8s.deployment.name` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.deployment.name`) CODEC(ZSTD(1)),
      `__otel_materialized_k8s.namespace.name` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.namespace.name`) CODEC(ZSTD(1)),
      `__otel_materialized_k8s.node.name` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.node.name`) CODEC(ZSTD(1)),
      `__otel_materialized_k8s.pod.name` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.pod.name`) CODEC(ZSTD(1)),
      `__otel_materialized_k8s.pod.uid` LowCardinality(String)
        MATERIALIZED toString(ResourceAttributes.`k8s.pod.uid`) CODEC(ZSTD(1)),
      INDEX idx_trace_id TraceId TYPE bloom_filter(0.001) GRANULARITY 1,
      INDEX idx_body Body TYPE tokenbf_v1(32768, 3, 0) GRANULARITY 8,
      INDEX idx_namespace `__otel_materialized_k8s.namespace.name` TYPE bloom_filter(0.01) GRANULARITY 1,
      INDEX idx_pod `__otel_materialized_k8s.pod.name` TYPE bloom_filter(0.01) GRANULARITY 1
    )
    ENGINE = MergeTree
    PARTITION BY toDate(Timestamp)
    ORDER BY (toStartOfFiveMinutes(Timestamp), ServiceName, Timestamp)
    TTL toDateTime(Timestamp) + INTERVAL 15 DAY
    SETTINGS index_granularity = 8192, ttl_only_drop_parts = 1;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ck-benchmark-schema-v3
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ck-benchmark-schema-v3
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: clickhouse/clickhouse-server:26.8
          command:
            - /bin/sh
            - -ec
            - clickhouse-client --host ck-cluster-clickhouse-headless --multiquery < /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: ck-benchmark-schema-v3
