apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ck-collector
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.159.0
  # Run as root so /var/log/auth.log, kern.log, etc. (root:adm) are readable.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # Run on every node, including tainted control-plane / server nodes.
  tolerations:
    - operator: Exists
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: HOST_PROC
      value: /hostfs/proc
    - name: HOST_SYS
      value: /hostfs/sys
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: hostproc
      hostPath:
        path: /proc
    - name: hostsys
      hostPath:
        path: /sys
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: hostproc
      mountPath: /hostfs/proc
      readOnly: true
    - name: hostsys
      mountPath: /hostfs/sys
      readOnly: true
  config:
    receivers:
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          network: {}
          disk: {}
          paging: {}
          processes: {}
          # system.uptime is the node-liveness signal Grafana alerts on.
          system: {}
          filesystem:
            # mountpoint is reported as the host sees it, without the
            # root_path prefix.
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - /(dev|proc|sys)($|/.*)
                - /run/k3s/containerd/.*
                - /var/lib/kubelet/.*
                - /snap/.*
            exclude_fs_types:
              match_type: strict
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
      filelog:
        include:
          - /var/log/syslog
          - /var/log/auth.log
          - /var/log/kern.log
        exclude:
          - /var/log/pods/**
          - /var/log/containers/**
        start_at: end
        include_file_path: true
        retry_on_failure:
          enabled: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, system]
        system:
          hostname_sources: [os]
        override: false
      resource:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
    # ttl only takes effect when create_schema builds a table for the first
    # time; existing tables need ALTER TABLE ... MODIFY TTL.
    exporters:
      clickhouse/logs_map:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        logs_table_name: log_map
        create_schema: true
        ttl: 360h
      clickhouse/logs_json:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        json: true
        logs_table_name: log_json
        create_schema: true
        ttl: 360h
      clickhouse/metrics:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        metrics_table_name: otel_metrics
        create_schema: true
        ttl: 360h
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, resourcedetection, resource]
          exporters: [clickhouse/logs_map, clickhouse/logs_json]
        metrics:
          receivers: [hostmetrics]
          processors: [memory_limiter, resourcedetection, resource]
          exporters: [clickhouse/metrics]
