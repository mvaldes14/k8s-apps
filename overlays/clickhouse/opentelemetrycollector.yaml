apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ck-collector
spec:
  # This collector is a gateway. Host logs and metrics are collected by the
  # SigNoz k8s-infra agent and forwarded here over OTLP.
  mode: deployment
  replicas: 2
  image: otel/opentelemetry-collector-contrib:0.154.0
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  # Run on any schedulable node, including tainted control-plane nodes.
  tolerations:
    - operator: Exists
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 1s
        send_batch_size: 1000
    # ttl only takes effect when create_schema builds a table for the first
    # time; existing tables need ALTER TABLE ... MODIFY TTL.
    exporters:
      clickhouse/logs_map:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        logs_table_name: log_map
        create_schema: true
        ttl: 360h
      clickhouse/logs_json:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        json: true
        logs_table_name: log_json
        create_schema: true
        ttl: 360h
      clickhouse/metrics:
        endpoint: tcp://ck-cluster-clickhouse-headless:9000?dial_timeout=10s&compress=lz4
        database: homelab
        metrics_table_name: otel_metrics
        create_schema: true
        ttl: 360h
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/logs_map, clickhouse/logs_json]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/metrics]
