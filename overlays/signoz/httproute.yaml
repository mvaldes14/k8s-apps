apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz-otel
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - otel.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/metrics
        - path:
            type: PathPrefix
            value: /v1/logs
        - path:
            type: PathPrefix
            value: /v1/traces
      backendRefs:
        - name: signoz-signoz-helm-otel-collector
          port: 4318
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz-mcp-server
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - signoz-mcp.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: signoz-mcp-server
          port: 8000
