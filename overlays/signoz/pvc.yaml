apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-data
  labels:
    app: signoz-clickhouse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-direct
  volumeName: signoz-clickhouse-data-eva04
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-cold
  labels:
    app: signoz-clickhouse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 10Gi
