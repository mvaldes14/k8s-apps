apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: signoz-otel-ingressroute
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`otel.int.mvaldes.dev`) && PathPrefix(`/v1/metrics`)
      services:
        - name: signoz-signoz-helm-otel-collector
          port: 4318
    - kind: Rule
      match: Host(`otel.int.mvaldes.dev`) && PathPrefix(`/v1/logs`)
      services:
        - name: signoz-signoz-helm-otel-collector
          port: 4318
    - kind: Rule
      match: Host(`otel.int.mvaldes.dev`) && PathPrefix(`/v1/traces`)
      services:
        - name: signoz-signoz-helm-otel-collector
          port: 4318
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: signoz-mcp-server
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: Host(`signoz-mcp.int.mvaldes.dev`)
      services:
        - name: signoz-mcp-server
          port: 8000
