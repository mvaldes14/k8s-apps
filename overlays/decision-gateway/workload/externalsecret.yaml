apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decision-gateway-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store-apps
  refreshPolicy: Periodic
  refreshInterval: 10m
  dataFrom:
    - extract:
        key: apps/decision-gateway
  target:
    name: decision-gateway-config
    creationPolicy: Owner
    deletionPolicy: Delete
