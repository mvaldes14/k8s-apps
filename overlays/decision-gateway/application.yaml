apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: decision-gateway
spec:
  project: homelab
  source:
    repoURL: https://github.com/mvaldes14/k8s-apps.git
    targetRevision: main
    path: overlays/decision-gateway/workload
  destination:
    server: https://kubernetes.default.svc
    namespace: decision-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
