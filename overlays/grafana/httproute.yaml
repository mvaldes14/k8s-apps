apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-mcp-server
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - grafana-mcp.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-mcp-server
          port: 8000
