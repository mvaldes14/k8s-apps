apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
spec:
  interval: 10m
  chart:
    spec:
      chart: mimir-distributed
      version: '*'
      sourceRef:
        kind: HelmRepository
        name: grafana-official
  values:
    deploymentMode: monolithic
    monolithic:
      replicas: 1
    minio:
      enabled: true
