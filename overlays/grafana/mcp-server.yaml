apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-secrets
  namespace: grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store-apps
  refreshPolicy: Periodic
  refreshInterval: 10m
  dataFrom:
    - extract:
        key: apps/grafana-mcp
  target:
    name: grafana-mcp-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-server
  namespace: grafana
  labels:
    app: grafana-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp-server
  template:
    metadata:
      labels:
        app: grafana-mcp-server
    spec:
      containers:
        - name: grafana-mcp-server
          image: grafana/mcp-grafana:latest
          imagePullPolicy: Always
          args:
            - -t
            - streamable-http
            - --allowed-hosts
            - grafana-mcp.int.mvaldes.dev,grafana-mcp.int.mvaldes.dev:443
          env:
            - name: GRAFANA_URL
              value: http://grafana-grafana-release.grafana.svc.cluster.local
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-secrets
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
          ports:
            - name: http
              containerPort: 8000
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp-server
  namespace: grafana
spec:
  selector:
    app: grafana-mcp-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-mcp-server
  namespace: grafana
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: Host(`grafana-mcp.int.mvaldes.dev`)
      services:
        - name: grafana-mcp-server
          port: 8000
