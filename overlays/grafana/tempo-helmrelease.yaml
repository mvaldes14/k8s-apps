apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: '*'
      sourceRef:
        kind: HelmRepository
        name: grafana-helm
  values:
    tempo:
      reportingEnabled: false
    persistence:
      enabled: true
      storageClassName: nfs-k8s-keep
      size: 10Gi
