apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-deploy
spec:
  selector:
    matchLabels:
      app: search-deploy
  replicas: 1
  template:
    metadata:
      labels:
        app: search-deploy
    spec:
      containers:
        - name: search-deploy
          image: searxng/searxng:latest
          imagePullPolicy: Always
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          env:
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_BASE_URL
              value: https://search.mvaldes.dev
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secret_key
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: searxng-pvc
              mountPath: /etc/searxng
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: searxng-pvc
          persistentVolumeClaim:
            claimName: searxng-pvc
        - name: config
          configMap:
            name: searxng-config
      restartPolicy: Always
