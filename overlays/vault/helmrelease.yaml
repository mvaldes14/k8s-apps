apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: vault-release
spec:
  targetNamespace: vault 
  chart:
    spec:
      chart: vault 
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: vault-helm
      version: 0.30.0 
  interval: 1m0s
  valuesFrom:
    - kind: ConfigMap
      name: vault-cm
