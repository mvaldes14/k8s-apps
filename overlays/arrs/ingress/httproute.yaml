apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - bazarr.int.mvaldes.dev
  rules:
    - backendRefs:
        - name: bazarr-svc
          port: 80
---
