apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 2Gi
    storageClass: nfs-k8s-keep
  walStorage:
    size: 1Gi
    storageClass: nfs-k8s
  bootstrap:
    initdb:
      database: personal
      owner: admin
      secret:
        name: db-secret
  # TODO: object-storage backups. Fill in endpoint/bucket and create the
  # `pg-backup-creds` secret (keys: ACCESS_KEY_ID, ACCESS_SECRET_KEY) via
  # SOPS or ExternalSecrets before enabling. Paired ScheduledBackup lives in
  # db/scheduledbackup.yaml.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://CHANGEME-bucket/homelab-db   # TODO: real bucket/path
      endpointURL: https://CHANGEME-endpoint             # TODO: MinIO/S3/GCS endpoint
      s3Credentials:
        accessKeyId:
          name: pg-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pg-backup-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
