apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-db
spec:
  instances: 1
  enablePDB: false
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9187"
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  managed:
    roles:
      - name: nerv
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        passwordSecret:
          name: nerv-db-credentials
  storage:
    size: 2Gi
    storageClass: nfs-k8s-keep
  walStorage:
    size: 1Gi
    storageClass: nfs-k8s-keep
  bootstrap:
    initdb:
      database: personal
      owner: admin
      secret:
        name: db-secret
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://mvaldes-pg-backup/homelab-db
      s3Credentials:
        accessKeyId:
          name: pg-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pg-backup-creds
          key: ACCESS_SECRET_KEY
        region:
          name: pg-backup-creds
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
