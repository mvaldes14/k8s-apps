apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: td
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - doit-mcp.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: td-svc-mcp
          port: 80
