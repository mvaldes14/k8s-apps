apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata:
  name: events
spec:
  cluster:
    clusterRef:
      name: redpanda
  partitions: 3
  replicationFactor: 1
  additionalConfig:
    retention.ms: "604800000"
    cleanup.policy: delete
---
apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata:
  name: github
spec:
  cluster:
    clusterRef:
      name: redpanda
  partitions: 3
  replicationFactor: 1
  additionalConfig:
    retention.ms: "86400000"
    cleanup.policy: delete
---
apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata:
  name: logs
spec:
  cluster:
    clusterRef:
      name: redpanda
  partitions: 3
  replicationFactor: 1
  additionalConfig:
    retention.ms: "86400000"
    cleanup.policy: delete
    max.message.bytes: "8388608"
