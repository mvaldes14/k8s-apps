apiVersion: v1
kind: Namespace
metadata:
  name: redpanda
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: redpanda-helm
spec:
  interval: 1m0s
  url: https://charts.redpanda.com
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: redpanda-operator
spec:
  targetNamespace: redpanda
  chart:
    spec:
      chart: operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: redpanda-helm
      version: 26.2.2
  interval: 1m0s
  values:
    # Install the stable CRDs (Redpanda, Topic, User, Schema).
    # Default is false; a pre-install job runs `redpanda-operator crd`.
    crds:
      enabled: true
    logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
