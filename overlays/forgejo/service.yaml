apiVersion: v1
kind: Service
metadata:
  name: forgejo-svc
spec:
  selector:
    app: forgejo
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    # git-over-SSH is reached through Traefik's `ssh` entrypoint
    # (IngressRouteTCP forgejo-ssh -> here:22). No dedicated LoadBalancer: the
    # Traefik VIP (10.14.0.230, where git.int.mvaldes.dev resolves) carries 22.
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
