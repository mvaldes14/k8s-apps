# Routes raw TCP on Traefik's `ssh` entrypoint (port 22) to Forgejo. SSH carries
# no SNI, so HostSNI(`*`) matches every connection on the entrypoint and hands it
# straight to the pod's SSH port. Reached over the LAN/tailnet via Traefik's VIP.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forgejo-ssh
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forgejo-svc
          port: 22
