apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
data:
  config.json: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "github",
      "gitAuthor": "Renovate Bot <renovate@mvaldes.dev>",
      "onboarding": false,
      "requireConfig": "optional",
      "repositories": [
        "mvaldes14/k8s-apps"
      ],
      "dependencyDashboard": true,
      "dependencyDashboardTitle": "Renovate Dependency Dashboard",
      "prConcurrentLimit": 5,
      "prHourlyLimit": 0,
      "ignorePaths": [
        "archive/**",
        "crds/**"
      ],
      "flux": {
        "managerFilePatterns": [
          "/^overlays/.+\\.ya?ml$/"
        ]
      },
      "kubernetes": {
        "managerFilePatterns": [
          "/^overlays/.+\\.ya?ml$/"
        ]
      },
      "packageRules": [
        {
          "description": "Flux image-automation owns these tags; Renovate must not fight it",
          "matchPackageNames": [
            "docker.io/rorix/blog",
            "docker.io/rorix/twitch-bot"
          ],
          "enabled": false
        },
        {
          "description": "CRD apiVersions follow the controller upgrade, not a Renovate PR",
          "matchDatasources": ["kubernetes-api"],
          "enabled": false
        },
        {
          "description": "Group non-major image bumps per overlay directory",
          "matchManagers": ["kubernetes"],
          "matchDatasources": ["docker"],
          "matchUpdateTypes": ["minor", "patch"],
          "groupName": "{{parentDir}} images"
        },
        {
          "description": "Helm charts get their own PR each; these are the risky ones",
          "matchManagers": ["flux"],
          "matchUpdateTypes": ["minor", "patch"],
          "groupName": null
        },
        {
          "description": "Majors are never grouped and never silent",
          "matchUpdateTypes": ["major"],
          "groupName": null,
          "labels": ["major-update"]
        }
      ]
    }
