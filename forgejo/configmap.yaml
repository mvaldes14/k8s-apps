apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 2
      timeout: 1h
      shutdown_timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - docker:host
    cache:
      enabled: true
      dir: /data/cache
      host: ""
      port: 0
    container:
      docker_host: "-"
      privileged: false
      valid_volumes: []
    host:
      workdir_parent: /data/workdir
