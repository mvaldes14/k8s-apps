apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-deploy
  namespace: forgejo
  labels:
    app: forgejo
spec:
  selector:
    matchLabels:
      app: forgejo
  replicas: 1
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo-pod
          image: codeberg.org/forgejo/forgejo:16
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: homelab-db-rw.db.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: git
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_USER
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWD
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: forgejo
  labels: { app: buildkitd }
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWX removes the mount deadlock, but never let two
                              # daemons touch one state dir — that corrupts the cache
  selector:
    matchLabels: { app: buildkitd }
  template:
    metadata:
      labels: { app: buildkitd }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # makes the NFS cache writable by the rootless user
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.19.0-rootless   # check for the current stable tag
          args:
            - --addr=unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr=tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --config=/home/user/.config/buildkit/buildkitd.toml
          ports:
            - containerPort: 1234
          readinessProbe:
            tcpSocket: { port: 1234 }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 1234 }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }   # modern field form; drops the deprecated annotation
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: true # rootless: no priv-esc, no privileged flag
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: cache, mountPath: /home/user/.local/share/buildkit }
            - { name: config, mountPath: /home/user/.config/buildkit }
            - { name: runtime, mountPath: /run/user/1000 }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: buildkitd-cache }
        - name: config
          configMap: { name: buildkitd-config }
        - name: runtime
          emptyDir: { medium: Memory }
