apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-deploy
  namespace: forgejo
  labels:
    app: forgejo
spec:
  selector:
    matchLabels:
      app: forgejo
  replicas: 1
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo-pod
          image: codeberg.org/forgejo/forgejo:16
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: homelab-db-rw.db.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: git
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_USER
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWD
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-ci
  namespace: forgejo
  labels: { app: forgejo-ci }
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWX removes the mount deadlock, but never let two
                              # daemons touch one state dir — that corrupts the cache
  selector:
    matchLabels: { app: forgejo-ci }
  template:
    metadata:
      labels: { app: forgejo-ci }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # makes the NFS cache writable by the rootless user
      containers:
        - name: forgejo-ci
          image: moby/buildkit:v0.19.0-rootless   # check for the current stable tag
          args:
            - --addr=unix:///run/user/1000/buildkit/forgejo-ci.sock
            - --addr=tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --config=/home/user/.config/buildkit/forgejo-ci.toml
          ports:
            - containerPort: 1234
          readinessProbe:
            tcpSocket: { port: 1234 }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 1234 }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }   # modern field form; drops the deprecated annotation
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: true # rootless: no priv-esc, no privileged flag
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: cache, mountPath: /home/user/.local/share/buildkit }
            - { name: config, mountPath: /home/user/.config/buildkit }
            - { name: runtime, mountPath: /run/user/1000 }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: forgejo-ci-cache }
        - name: config
          configMap: { name: forgejo-ci-config }
        - name: runtime
          emptyDir: { medium: Memory }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels: { app: forgejo-runner, role: forgejo-runner }   # role matches the CiliumNetworkPolicy
spec:
  replicas: 1
  selector:
    matchLabels: { app: forgejo-runner }
  template:
    metadata:
      labels: { app: forgejo-runner, role: forgejo-runner }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yaml"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: config, secret: { secretName: "forgejo-running-config"}}
        - { name: data, persistentVolumeClaim: { claimName: "forgejo-runner-config"}}
