apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-ci-cache
  namespace: forgejo
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-config
  namespace: forgejo
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 250Mi
