apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-k8s-keep
  resources:
    requests:
      storage: 1Gi

