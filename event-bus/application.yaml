apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventbus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mvaldes14/eventbus.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
